<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Araucana - Check-in</title>
    <link rel="stylesheet" href="../Aena/widget.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <div class="widget-container">
        <div class="widget-header">
            <div class="logo-container">
                <img src="images/Logo_La_Araucana.png" alt="La Araucana Logo" class="logo-img">
            </div>
        </div>

        <form id="reservationForm" class="reservation-form">
            <!-- Nombre -->
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>

            <!-- Apellido -->
            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" class="form-control" required>
            </div>

            <!-- RUT -->
            <div class="form-group">
                <label for="rut">RUT</label>
                <input type="number" id="rut" name="rut" class="form-control" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <!-- Política de privacidad -->
            <div class="legal-links">
                <p class="legal-text">
                    Al continuar, acepta nuestra&nbsp;<a href="https://storage.googleapis.com/ara-pco-storage/2025/06/Politica-de-Seguridad-de-Datos.pdf" target="_blank" rel="noopener noreferrer" class="legal-link">política de privacidad</a>.
                </p>
            </div>

            <!-- reCAPTCHA -->
            <div class="form-group">
                <div class="g-recaptcha" data-sitekey="6LexAhgsAAAAANc5FRiF2HxYSTpgPmTR-97E6vv7"></div>
            </div>

            <!-- Botón de envío -->
            <button type="submit" class="btn btn-primary" id="submitBtn">
                <span class="btn-text" id="btnText">Reservar</span>
                <span class="btn-loader" id="btnLoader" style="display: none;">⏳</span>
            </button>
        </form>

        <!-- Mensaje de éxito/error -->
        <div class="message-container" id="messageContainer" style="display: none;">
            <div class="message" id="message"></div>
        </div>

        <!-- Sala de espera -->
        <div class="waiting-room" id="waitingRoom" style="display: none;">
            <div class="waiting-content">
                <div class="waiting-icon">⏳</div>
                <h2 class="waiting-title">Turno Generado</h2>
                <p class="waiting-message">Su turno ha sido encolado. Esperando confirmación...</p>
                <div class="waiting-loader">
                    <div class="loader"></div>
                </div>
                <div class="turn-info" id="turnInfo"></div>
                <button class="btn btn-secondary" id="cancelWaiting">Cancelar</button>
            </div>
        </div>

        <!-- Modal de Turno Generado -->
        <div class="modal-overlay" id="turnSuccessModal">
            <div class="modal-container turn-success-modal">
                <div class="turn-success-content">
                    <!-- Header -->
                    <div class="turn-modal-header">
                        <div class="turn-modal-header-left">
                            <span class="turn-modal-clock-icon">🕐</span>
                            <h2 class="turn-modal-header-title">RESERVE SU TURNO</h2>
                        </div>
                        <button class="turn-modal-close-btn" id="closeTurnSuccessModal">×</button>
                    </div>

                    <!-- Success Banner -->
                    <div class="turn-success-banner">
                        <div class="turn-success-banner-content">
                            <span class="turn-success-check">✓</span>
                            <span class="turn-success-banner-text">Turno Generado Exitosamente</span>
                        </div>
                    </div>
                    <p class="turn-success-message">¡Su turno ha sido generado en el sistema!</p>

                    <!-- Turn Information Cards -->
                    <div class="turn-info-cards">
                        <!-- Código del Turno (Full Width) -->
                        <div class="turn-info-card turn-info-card-full">
                            <span class="turn-info-card-label">Código del Turno:</span>
                            <span class="turn-info-card-value turn-code-link" id="turnCodeDisplay">-</span>
                        </div>

                        <!-- Two Column Cards -->
                        <div class="turn-info-cards-row">
                            <div class="turn-info-card">
                                <span class="turn-info-card-label">Turno:</span>
                                <span class="turn-info-card-value" id="turnNumberDisplay">-</span>
                            </div>
                            <div class="turn-info-card">
                                <span class="turn-info-card-label">Estado del Turno:</span>
                                <span class="turn-info-card-value" id="turnStatusDisplay">En breve lo llamaremos</span>
                            </div>
                        </div>
                    </div>

                    <!-- Cancel Button -->
                    <div class="turn-modal-buttons">
                        <button class="btn btn-cancel-turn" id="cancelTurnBtn">Cancelar mi turno</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS TODO JUNTO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE_URL = 'https://filavirtual2.debmedia.com/api/v1/queue';
            const API_TOKEN = 'm7NCbNDBShZOV83fu6RGJV1DbkhSkWI6JSTxmT2e';
            const QUEUE_ID = 9460;
            const BRANCH_ID = 11;

            const form = document.getElementById('reservationForm');
            const nombreInput = document.getElementById('nombre');
            const apellidoInput = document.getElementById('apellido');
            const rutInput = document.getElementById('rut');
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            const messageContainer = document.getElementById('messageContainer');
            const messageBox = document.getElementById('message');

            const waitingRoom = document.getElementById('waitingRoom');
            const turnInfo = document.getElementById('turnInfo');
            const cancelWaitingBtn = document.getElementById('cancelWaiting');

            const turnSuccessModal = document.getElementById('turnSuccessModal');
            const turnNumberDisplay = document.getElementById('turnNumberDisplay');
            const turnStatusDisplay = document.getElementById('turnStatusDisplay');
            const turnCodeDisplay = document.getElementById('turnCodeDisplay');
            const closeTurnSuccessModal = document.getElementById('closeTurnSuccessModal');
            const cancelTurnBtn = document.getElementById('cancelTurnBtn');

            // Variable para el intervalo de polling
            let pollingInterval = null;

            function showMessage(text, type) {
                if (!messageContainer || !messageBox) return;
                messageBox.textContent = text;
                messageBox.className = 'message ' + (type === 'error' ? 'message-error' : 'message-success');
                messageContainer.style.display = 'block';
            }

            function hideMessage() {
                if (!messageContainer) return;
                messageContainer.style.display = 'none';
            }

            function setLoading(isLoading) {
                if (!submitBtn || !btnText || !btnLoader) return;
                submitBtn.disabled = isLoading;
                btnLoader.style.display = isLoading ? 'inline-block' : 'none';
                btnText.style.display = isLoading ? 'none' : 'inline';
            }

            function clearForm() {
                if (!form) return;
                form.reset();
                if (typeof grecaptcha !== 'undefined') {
                    grecaptcha.reset();
                }
                hideMessage();
            }

            async function createTurn(payload) {
                const apiUrl = `${API_BASE_URL}/${QUEUE_ID}/branch/${BRANCH_ID}/enqueue`;
                
                console.log('Enviando payload a Debmedia:', payload);
                console.log('URL:', apiUrl);

                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_TOKEN
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    let extra = '';
                    try { extra = await res.text(); } catch (_) {}
                    throw new Error('Error API (' + res.status + '): ' + extra);
                }

                try { return await res.json(); }
                catch (_) { return {}; }
            }

            // Cancelar sala de espera
            if (cancelWaitingBtn && waitingRoom) {
                cancelWaitingBtn.addEventListener('click', () => {
                    waitingRoom.style.display = 'none';
                });
            }

            // Función para actualizar el modal con los datos del turno
            function updateTurnModal({ code, turn, turnStatus }) {
                if (turnCodeDisplay && code) turnCodeDisplay.textContent = code;
                if (turnNumberDisplay && turn) turnNumberDisplay.textContent = turn;
                
                // Actualizar estado del turno
                if (turnStatusDisplay && turnStatus) {
                    let statusText = '';
                    if (turnStatus === 'ANNOUNCED' || turnStatus === 'calling' || turnStatus === 'being_called') {
                        statusText = 'Lo estamos llamando';
                    } else if (turnStatus === 'WAITING_TO_BE_CALLED' || turnStatus === 'waiting') {
                        statusText = 'En breve lo llamaremos';
                    } else if (turnStatus === 'FINALIZED' || turnStatus === 'finalized') {
                        statusText = 'Atención finalizada';
                    } else {
                        statusText = turnStatus;
                    }
                    turnStatusDisplay.textContent = statusText;
                }
            }

            // Función para iniciar el polling del estado del turno
            function startPolling(turnCode) {
                stopPolling();
                
                if (!turnCode || turnCode === 'N/A' || turnCode === '-') {
                    return;
                }

                const cleanCode = turnCode.trim().replace(/\s+/g, '');
                const url = `https://mobile.clients.debmedia.com/api/v1/turn/code/${encodeURIComponent(cleanCode)}`;

                const mapStatus = (status) => {
                    if (status === 'ANNOUNCED') {
                        return { text: 'Lo estamos llamando', cls: 'status-ok' };
                    } else if (status === 'WAITING_TO_BE_CALLED') {
                        return { text: 'En breve lo llamaremos', cls: 'status-warn' };
                    } else if (status === 'FINALIZED') {
                        return { text: 'Atención finalizada', cls: 'status-done' };
                    } else {
                        return { text: status || 'Desconocido', cls: 'status-warn' };
                    }
                };

                const tick = async () => {
                    try {
                        const res = await fetch(url, {
                            headers: {
                                'Authorization': 'Bearer ' + API_TOKEN,
                                'Content-Type': 'application/json'
                            }
                        });

                        if (!res.ok) {
                            throw new Error(`Estado no disponible (${res.status})`);
                        }

                        const data = await res.json();
                        const turnData = data.data || data;
                        const jsonDetails = turnData.jsonDetails || data.jsonDetails || {};

                        // Mapear el estado
                        const status = turnData.status || turnData.turnStatus || 'WAITING_TO_BE_CALLED';
                        const m = mapStatus(status);
                        
                        if (turnStatusDisplay) {
                            turnStatusDisplay.textContent = m.text;
                            turnStatusDisplay.className = `turn-info-card-value ${m.cls}`;
                        }

                        // Extraer turno
                        const turn = jsonDetails.turn || turnData.turn || '-';

                        // Actualizar otros campos si están disponibles
                        updateTurnModal({
                            code: cleanCode,
                            turn: turn,
                            turnStatus: status
                        });

                    } catch (e) {
                        console.error('Error al consultar estado del turno:', e);
                        if (turnStatusDisplay) {
                            turnStatusDisplay.textContent = 'Error al consultar';
                            turnStatusDisplay.className = 'turn-info-card-value status-err';
                        }
                    }
                };

                // Ejecutar inmediatamente y luego cada 5 segundos
                tick();
                pollingInterval = setInterval(tick, 5000);
            }

            // Función para detener el polling
            function stopPolling() {
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                }
            }

            // Cerrar modal de turno generado
            if (closeTurnSuccessModal && turnSuccessModal) {
                closeTurnSuccessModal.addEventListener('click', () => {
                    turnSuccessModal.classList.remove('active');
                    stopPolling();
                });

                turnSuccessModal.addEventListener('click', (e) => {
                    if (e.target === turnSuccessModal) {
                        turnSuccessModal.classList.remove('active');
                        stopPolling();
                    }
                });
            }

            // Función para cancelar turno
            async function cancelTurn(turnCode) {
                // Limpiar el código (sin espacios)
                const cleanCode = turnCode ? turnCode.trim().replace(/\s+/g, '') : null;
                
                if (!cleanCode || cleanCode === 'N/A' || cleanCode === '-') {
                    showMessage('Hubo un error al cancelar su turno. Inténtelo de nuevo.', 'error');
                    return;
                }

                if (!confirm('¿Está seguro de que desea cancelar su turno?')) {
                    return;
                }

                try {
                    const cancelUrl = `https://filavirtual2.debmedia.com/api/v1/turn/${cleanCode}/cancel`;
                    console.log('Cancelando turno:', cancelUrl);
                    console.log('Código usado:', cleanCode);

                    const res = await fetch(cancelUrl, {
                        method: 'POST',
                        body: "{}",
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + API_TOKEN
                        }
                    });

                    if (!res.ok) {
                        let extra = '';
                        try { extra = await res.text(); } catch (_) {}
                        throw new Error('Error API (' + res.status + '): ' + extra);
                    }

                    // Si la respuesta es 200 OK, limpiar formulario y redirigir
                    if (res.status === 200 || res.ok) {
                        // Detener el polling antes de cerrar
                        stopPolling();
                        
                        showMessage('Su turno ha sido cancelado exitosamente.', 'success');
                        
                        // Cerrar el modal después de cancelar
                        if (turnSuccessModal) {
                            turnSuccessModal.classList.remove('active');
                        }

                        // Resetear el formulario y ocultar mensajes
                        if (form) {
                            form.reset();
                            // Resetear reCAPTCHA
                            if (typeof grecaptcha !== 'undefined') {
                                grecaptcha.reset();
                            }
                        }
                        hideMessage();

                        // Redirigir al formulario original después de un breve delay
                        setTimeout(() => {
                            window.location.reload();
                        }, 1500);
                    }

                } catch (err) {
                    console.error('Error al cancelar turno:', err);
                    showMessage('Hubo un error al cancelar su turno. Inténtelo de nuevo.', 'error');
                }
            }

            // Event listener para botón de cancelar turno
            if (cancelTurnBtn) {
                cancelTurnBtn.addEventListener('click', () => {
                    const turnCode = turnCodeDisplay ? turnCodeDisplay.textContent : null;
                    cancelTurn(turnCode);
                });
            }

            // Submit formulario
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    hideMessage();

                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return;
                    }

                    // Validar reCAPTCHA
                    const recaptchaResponse = grecaptcha.getResponse();
                    if (!recaptchaResponse) {
                        showMessage('Por favor, complete el reCAPTCHA para continuar.', 'error');
                        return;
                    }

                    const nombre = nombreInput.value.trim();
                    const apellido = apellidoInput.value.trim();
                    const rut = rutInput.value.trim();
                    const email = emailInput.value.trim();

                    const payload = {
                        firstName: nombre,
                        lastName: apellido,
                        email: email,
                        phone: rut // Usando RUT como phone temporalmente, ajustar según necesidad
                    };

                    try {
                        setLoading(true);

                        const result = await createTurn(payload);
                        console.log('Turno creado:', result);

                        // Extraer información del turno de la respuesta
                        const turnData = result.data || result;
                        
                        // Extraer código del turno
                        const turnCode = turnData.code || result.code || turnData.ticketNumber || 
                                        result.turnCode || result.ticketNumber || 
                                        turnData.id || result.id || 
                                        turnData.ticket || result.ticket || 
                                        turnData.number || result.number || 
                                        'N/A';

                        // Extraer número de turno (campo "turn" de jsonDetails o directamente)
                        const jsonDetails = turnData.jsonDetails || result.jsonDetails || {};
                        const turn = jsonDetails.turn || turnData.turn || result.turn || '-';

                        // Extraer estado del turno
                        const turnStatus = turnData.turnStatus || result.turnStatus || 
                                         turnData.status || result.status || 
                                         'WAITING_TO_BE_CALLED';
                        
                        let statusText = '';
                        if (turnStatus === 'ANNOUNCED' || turnStatus === 'calling' || turnStatus === 'being_called') {
                            statusText = 'Lo estamos llamando';
                        } else if (turnStatus === 'WAITING_TO_BE_CALLED' || turnStatus === 'waiting') {
                            statusText = 'En breve lo llamaremos';
                        } else if (turnStatus === 'FINALIZED' || turnStatus === 'finalized') {
                            statusText = 'Atención finalizada';
                        } else {
                            statusText = 'En breve lo llamaremos';
                        }

                        // Actualizar el modal con los datos iniciales
                        updateTurnModal({
                            code: turnCode,
                            turn: turn,
                            turnStatus: turnStatus
                        });

                        if (turnSuccessModal) {
                            turnSuccessModal.classList.add('active');
                        }

                        // Iniciar polling para actualizar el estado del turno dinámicamente
                        startPolling(turnCode);

                    } catch (err) {
                        console.error(err);
                        showMessage('Hubo un problema al generar su turno. Inténtelo de nuevo.', 'error');
                    } finally {
                        setLoading(false);
                    }
                });
            }
        });
    </script>
</body>
</html>


</body>
</html>
